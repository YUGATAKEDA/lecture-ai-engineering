name: Run Tests

on:
  push:
    branches:
      - day5
  pull_request:
    branches:
      - day5

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v3

    - name: Pythonセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: 依存関係のインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: テストの実行
      run: |
        pytest test_model.py
        pytest test_data.py
